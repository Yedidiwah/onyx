<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ONYX Preferences</title>
    
    <!-- החיבור הרשמי ל-API של טלגרם מיני-אפס -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <style>
        :root {
            --bg-color: #0a0a0a;
            --text-color: #f0f0f0;
            --accent-color: #ffffff;
            --input-bg: #1a1a1a;
            --border-color: #333333;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            width: 100%;
        }

        .logo {
            font-size: 28px;
            font-weight: 300;
            letter-spacing: 12px;
            margin-bottom: 10px;
            color: var(--accent-color);
        }

        .subtitle {
            font-size: 12px;
            color: #888;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .form-container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 11px;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            padding-left: 5px;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 16px;
            font-size: 16px;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.3s ease;
        }

        input:focus {
            border-color: #666;
        }

        /* עיצוב כפתור השמירה */
        .btn-save {
            background-color: var(--accent-color);
            color: #000000;
            border: none;
            padding: 18px;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
            transition: opacity 0.2s ease;
        }

        .btn-save:active {
            opacity: 0.8;
        }

        .note {
            font-size: 11px;
            color: #555;
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">ONYX</div>
        <div class="subtitle">Flight Intelligence</div>
    </div>

    <div class="form-container">
        <div class="input-group">
            <label for="origin">Departure (City or Country)</label>
            <!-- שימוש ב-datalist נותן חוויית השלמה אוטומטית יוקרתית בלי לכתוב המון קוד -->
            <input type="text" id="origin" placeholder="e.g. London, Paris, Anytime" list="hubs" autocomplete="off">
        </div>

        <div class="input-group">
            <label for="destination">Arrival (City or Country)</label>
            <input type="text" id="destination" placeholder="e.g. Nice, Milan, Anywhere" list="hubs" autocomplete="off">
        </div>

        <button class="btn-save" onclick="sendDataToBot()">Sync Preferences</button>
        <div class="note">Data is securely transmitted to your ONYX node.</div>
    </div>

    <!-- רשימת יעדים נפוצים להשלמה אוטומטית -->
    <datalist id="hubs">
        <option value="Anywhere (Global)"></option>
        <option value="Anywhere in Europe"></option>
        <option value="London, United Kingdom"></option>
        <option value="Paris, France"></option>
        <option value="Nice, France"></option>
        <option value="Geneva, Switzerland"></option>
        <option value="Milan, Italy"></option>
        <option value="Ibiza, Spain"></option>
        <option value="Dubai, United Arab Emirates"></option>
        <option value="Zurich, Switzerland"></option>
        <option value="Rome, Italy"></option>
    </datalist>

    <script>
        // אתחול האפליקציה מול טלגרם
        let tg = window.Telegram.WebApp;
        tg.expand(); // פותח את החלון לגובה מלא של המסך

        function sendDataToBot() {
            let origin = document.getElementById("origin").value.trim();
            let destination = document.getElementById("destination").value.trim();

            if (origin === "" || destination === "") {
                tg.showAlert("Please fill in both Departure and Arrival locations.");
                return;
            }

            // אריזת הנתונים לפורמט JSON
            let data = {
                origin: origin,
                destination: destination
            };

            // השליחה השקטה לבוט (מפעיל את פונקציית ה-handle_webapp_data בפייתון)
            tg.sendData(JSON.stringify(data));
            
            // סגירת החלון הקופץ חזרה לשיחה בטלגרם
            tg.close();
        }
    </script>
</body>
</html>
