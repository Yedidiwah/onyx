<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ONYX Preferences</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <style>
        :root {
            --bg-color: #0a0a0a;
            --text-color: #f0f0f0;
            --accent-color: #ffffff;
            --input-bg: #1a1a1a;
            --border-color: #333333;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header { text-align: center; margin-bottom: 40px; width: 100%; }
        .logo { font-size: 28px; font-weight: 300; letter-spacing: 12px; margin-bottom: 10px; color: var(--accent-color); }
        .subtitle { font-size: 12px; color: #888; letter-spacing: 1px; text-transform: uppercase; }

        .form-container { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 25px; }
        .input-group { display: flex; flex-direction: column; gap: 8px; }

        label { font-size: 11px; color: #aaa; text-transform: uppercase; letter-spacing: 1.5px; padding-left: 5px; }
        input {
            width: 100%; box-sizing: border-box; background-color: var(--input-bg);
            border: 1px solid var(--border-color); color: var(--text-color); padding: 16px;
            font-size: 16px; border-radius: 8px; outline: none; transition: border-color 0.3s ease;
        }
        input:focus { border-color: #666; }
        input:disabled { opacity: 0.5; } /* אפקט עמעום בזמן טעינת הנתונים */

        .btn-save {
            background-color: var(--accent-color); color: #000000; border: none; padding: 18px;
            font-size: 14px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase;
            border-radius: 8px; cursor: pointer; margin-top: 20px; transition: opacity 0.2s ease;
        }
        .btn-save:active { opacity: 0.8; }
        .btn-save:disabled { background-color: #555; cursor: not-allowed; }

        .note { font-size: 11px; color: #555; text-align: center; margin-top: 20px; }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">ONYX</div>
        <div class="subtitle">Flight Intelligence</div>
    </div>

    <div class="form-container">
        <div class="input-group">
            <label for="origin">Departure (City or Country)</label>
            <input type="text" id="origin" placeholder="Loading global airports..." list="hubs" autocomplete="off" disabled>
        </div>

        <div class="input-group">
            <label for="destination">Arrival (City or Country)</label>
            <input type="text" id="destination" placeholder="Loading global airports..." list="hubs" autocomplete="off" disabled>
        </div>

        <button class="btn-save" id="save-btn" onclick="sendDataToBot()" disabled>Sync Preferences</button>
        <div class="note">Data is securely transmitted to your ONYX node.</div>
    </div>

    <!-- הרשימה תתמלא אוטומטית על ידי הקוד למטה -->
    <datalist id="hubs"></datalist>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand(); 

        // משיכת ה-CSV ישירות מאותה תיקייה בשרת הגיטהאב
        fetch('airports_global.csv')
            .then(response => response.text())
            .then(data => {
                const lines = data.split('\n');
                const datalist = document.getElementById('hubs');
                
                let optionsHTML = '<option value="Anywhere (Global)"></option>\n';
                let countries = new Set();
                let airports = new Set();
                
                // מתחילים מ-1 כדי לדלג על שורת הכותרות ב-CSV
                for (let i = 1; i < lines.length; i++) {
                    let line = lines[i].trim();
                    if (!line) continue;
                    
                    let parts = line.split(',');
                    if (parts.length >= 3) {
                        // חילוץ המידע עם הגנה מפני פסיקים מיותרים ומרכאות
                        let country = parts[parts.length - 1].replace(/"/g, '').trim();
                        // חיבור שאר החלקים האמצעיים יחד כדי לא לאבד ערים שיש בהן פסיק בשם
                        let city = parts.slice(1, parts.length - 1).join(',').replace(/"/g, '').trim();
                        
                        countries.add(country);
                        // הפורמט שמתאים בול ללוגיקת הפייתון שלך
                        airports.add(`${city}, ${country}`);
                    }
                }
                
                // הזרקת המדינות ל-HTML
                Array.from(countries).sort().forEach(c => {
                    optionsHTML += `<option value="Anywhere in ${c}"></option>\n`;
                });
                
                // הזרקת הערים ל-HTML
                Array.from(airports).sort().forEach(a => {
                    optionsHTML += `<option value="${a}"></option>\n`;
                });
                
                datalist.innerHTML = optionsHTML;
                
                // שחרור הנעילה של השדות לאחר שהכל נטען
                document.getElementById('origin').disabled = false;
                document.getElementById('origin').placeholder = "e.g. London, Anywhere in Italy";
                
                document.getElementById('destination').disabled = false;
                document.getElementById('destination').placeholder = "e.g. Nice, Anywhere";
                
                document.getElementById('save-btn').disabled = false;
            })
            .catch(error => {
                console.error('Error loading airports CSV:', error);
                document.getElementById('origin').placeholder = "Error loading data";
                document.getElementById('destination').placeholder = "Error loading data";
            });

        function sendDataToBot() {
            let origin = document.getElementById("origin").value.trim();
            let destination = document.getElementById("destination").value.trim();

            if (origin === "" || destination === "") {
                tg.showAlert("Please fill in both Departure and Arrival locations.");
                return;
            }

            let data = {
                origin: origin,
                destination: destination
            };

            tg.sendData(JSON.stringify(data));
            tg.close();
        }
    </script>
</body>
</html>
