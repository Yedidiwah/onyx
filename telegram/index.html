<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://telegram.org; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; upgrade-insecure-requests;">
    <title>ONYX Radar Preferences</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div id="external-notice" hidden>
        Please open this page from the ONYX Telegram bot.
    </div>

    <div id="status">Loading...</div>

    <!-- Origin Section -->
    <div class="section">
        <label for="origin-mode">Origin Mode</label>
        <select id="origin-mode">
            <option value="all">All origins</option>
            <option value="country">Country</option>
            <option value="airport">Airport</option>
        </select>

        <div id="origin-country-panel" hidden>
            <select id="origin-country"></select>
        </div>

        <div id="origin-airport-panel" hidden>
            <input type="text" id="origin-airport-search" placeholder="Search origin airport...">
            <div id="origin-airport-results" hidden></div>
            <div id="origin-selected-airport" hidden></div>
        </div>
    </div>

    <!-- Destination Section -->
    <div class="section">
        <label for="destination-mode">Destination Mode</label>
        <select id="destination-mode">
            <option value="all">All destinations</option>
            <option value="country">Country</option>
            <option value="airport">Airport</option>
        </select>

        <div id="destination-country-panel" hidden>
            <select id="destination-country"></select>
        </div>

        <div id="destination-airport-panel" hidden>
            <input type="text" id="destination-airport-search" placeholder="Search destination airport...">
            <div id="destination-airport-results" hidden></div>
            <div id="destination-selected-airport" hidden></div>
        </div>
    </div>

    <!-- Frequency Section (Optional / Optional fallback) -->
    <div class="section">
        <label for="update-frequency">Alert Frequency</label>
        <select id="update-frequency">
            <option value="1">Every 1 hour</option>
            <option value="3">Every 3 hours</option>
            <option value="6">Every 6 hours</option>
            <option value="12">Every 12 hours</option>
            <option value="24">Every 24 hours</option>
        </select>
    </div>

    <!-- Summary -->
    <div id="summary">
        <span id="summary-origin"></span> -> <span id="summary-destination"></span>
        <p id="summary-description"></p>
    </div>

    <button type="button" id="save-button">SAVE TELEGRAM PREFERENCES</button>

    <script src="app.js"></script>
</body>
</html>
